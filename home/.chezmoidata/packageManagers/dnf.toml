[packageManagers.dnf]

root = true
command = "install"
args = [
  "-y",
]

groups = [
  "development-tools",
]

packages = [
  "clang",
  "flatpak",
  "podman",
  "wl-clipboard",
  "samba",
]

[packageManagers.dnf.minimal]

root = true
command = "install"
args = [
  "-y",
]

packages = [
  "clang",
  "podman",
]
