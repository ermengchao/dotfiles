apiVersion: v1
kind: Pod
metadata:
  name: elastic-kibana-local
spec:
  containers:
    - name: elasticsearch
      image: docker.elastic.co/elasticsearch/elasticsearch:9.4.1
      env:
        - name: discovery.type
          value: single-node
        - name: xpack.security.enabled
          value: "false"
        - name: ES_JAVA_OPTS
          value: "-Xms1g -Xmx1g"
      ports:
        - containerPort: 9200
          hostPort: 9200

    - name: kibana
      image: docker.elastic.co/kibana/kibana:9.4.1
      env:
        - name: ELASTICSEARCH_HOSTS
          value: http://localhost:9200
        - name: SERVER_HOST
          value: 0.0.0.0
        - name: NODE_OPTIONS
          value: --max-old-space-size=1024
      ports:
        - containerPort: 5601
          hostPort: 5601
