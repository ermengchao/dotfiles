[orb]
orb.arch ansible_host=orb ansible_user=arch
orb.fedora ansible_host=orb ansible_user=fedora
orb.nixos ansible_host=orb ansible_user=nixos

[orb:vars]
ansible_ssh_common_args=-F ~/.orbstack/ssh/config

[arch]
arch.orb ansible_host=arch.orb.local ansible_ssh_private_key_file=~/.orbstack/ssh/id_ed25519

[arch:vars]
ansible_user=chao
ansible_become=true
ansible_become_method=sudo
