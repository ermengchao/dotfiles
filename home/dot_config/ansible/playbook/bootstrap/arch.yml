---
- name: Bootstrap all Arch Linux hosts
  hosts: arch
  become: true

  vars:
    normal_user: "{{ ansible_user }}"
    normal_user_home: "/home/{{ normal_user }}"
    chezmoi_hostname: "arch"
    chezmoi_pretty_hostname: "Arch"
    op_service_account_token: "{{ lookup('ansible.builtin.env', 'OP_SERVICE_ACCOUNT_TOKEN') }}"
    user_env:
      HOME: "{{ normal_user_home }}"
      USER: "{{ normal_user }}"
      LOGNAME: "{{ normal_user }}"
      XDG_CONFIG_HOME: "{{ normal_user_home }}/.config"
      XDG_DATA_HOME: "{{ normal_user_home }}/.local/share"
      XDG_STATE_HOME: "{{ normal_user_home }}/.local/state"
      XDG_CACHE_HOME: "{{ normal_user_home }}/.cache"
      GIT_TERMINAL_PROMPT: "0"
      OP_SERVICE_ACCOUNT_TOKEN: "{{ op_service_account_token }}"

  pre_tasks:
    - name: Ensure target is Arch Linux
      assert:
        that:
          - ansible_facts["distribution"] == "Archlinux"
        fail_msg: "This playbook only supports Arch Linux."
        success_msg: "Arch Linux detected."

    - name: Require 1Password service account authentication
      assert:
        that:
          - op_service_account_token is string
          - op_service_account_token | trim | length > 0
        fail_msg: "Set OP_SERVICE_ACCOUNT_TOKEN on the Ansible controller, or provide op_service_account_token through Ansible Vault."
        quiet: true

  tasks:
    - name: Disable IPv6 temporarily
      command: sysctl -w {{ item }}
      loop:
        - net.ipv6.conf.all.disable_ipv6=1
        - net.ipv6.conf.default.disable_ipv6=1
      become: true

    - name: Install required packages
      community.general.pacman:
        name:
          - fish
          - chezmoi
          - age
          - git
        state: present
        update_cache: true

    - name: Run chezmoi init
      no_log: true
      become: true
      become_user: "{{ normal_user }}"
      command: >
        chezmoi --source {{ normal_user_home }}/.local/share/chezmoi --force --no-tty init ermengchao
        --promptString "💥 Hostname={{ chezmoi_hostname }},👀 Pretty hostname={{ chezmoi_pretty_hostname }}"
        --promptMultichoice "📦 Package manager=pacman/paru"
        --promptBool "☘️ Root device=false,🌐 Whether a proxy server=true"
      environment: "{{ user_env }}"
      args:
        creates: "{{ normal_user_home }}/.local/share/chezmoi"

    - name: Run chezmoi apply
      no_log: true
      become: true
      become_user: "{{ normal_user }}"
      command: >
        chezmoi --source {{ normal_user_home }}/.local/share/chezmoi --force --no-tty apply --init
      environment: "{{ user_env }}"

    - name: Reload system systemd daemon
      systemd:
        daemon_reload: true

    - name: Restart sshd
      systemd:
        name: sshd
        state: restarted

    - name: Set default shell to fish
      become: true
      user:
        name: "{{ normal_user }}"
        shell: /bin/fish

    - name: Configure subuid for normal user
      become: true
      lineinfile:
        path: /etc/subuid
        regexp: "^{{ normal_user }}:"
        line: "{{ normal_user }}:524288:65536"
        create: true
        mode: "0644"

    - name: Configure subgid for normal user
      become: true
      lineinfile:
        path: /etc/subgid
        regexp: "^{{ normal_user }}:"
        line: "{{ normal_user }}:524288:65536"
        create: true
        mode: "0644"
